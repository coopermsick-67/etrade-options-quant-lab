services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://quantlab:quantlab@postgres:5432/quantlab
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    volumes:
      - .:/app
      - web_node_modules:/app/apps/web/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: quantlab
      POSTGRES_DB: quantlab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  web_node_modules:

