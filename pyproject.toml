[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etrade-options-quant-lab"
version = "0.1.0"
description = "Reproducible options research, pricing, backtesting, and human-approved execution platform"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "httpx>=0.27,<1",
  "requests>=2.31,<3",
  "requests-oauthlib>=2.0,<3",
  "tenacity>=9,<10",
  "structlog>=24,<26",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.9,<1",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.110,<7",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "respx>=0.21,<1",
]

[project.scripts]
quantlab = "apps.api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["apps", "quant", "brokers", "data", "strategies", "scanner", "backtest", "paper", "execution", "compliance", "monitoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
